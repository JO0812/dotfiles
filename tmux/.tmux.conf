#scroll de trackpad
set -g extended-keys on

# === truecolor passthrough ===
# Without RGB, tmux quantizes 24-bit colors from apps (pi, nvim, etc.) to the
# nearest palette index and re-emits that index. Combined with the base16-shell
# Catppuccin palette this turns pastel backgrounds into saturated magenta.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',RGB'

#empieza con la ventana n*1
set -g base-index 1

#atajo para recargar config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Bind Prefix + Shift + S to enter copy mode (scroll)
bind S copy-mode

# === persistence across reboots (resurrect + continuum) ===
# resurrect: manual save = Prefix + Ctrl-s, restore = Prefix + Ctrl-r
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
# restore vim/nvim sessions, ssh, etc.
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'vim nvim ssh mosh-client python python3 node npm Muse opencode btop htop tail less man gitui lazygit'
# continuum: auto-save every 15 min + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'on'

# plugin tmux-resurrect
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux

# Easy splits (Spanish keyboard friendly)
bind - split-window        # horizontal (top/bottom)
bind | split-window -h     # vertical (left/right)

# Swap layout orientation for 2 panes
bind M-- select-layout even-vertical    # stacked
bind M-| select-layout even-horizontal  # side by side

# === pane highlighting ===
# Active pane: bright cyan bold border
set -g pane-active-border-style 'fg=cyan,bold'

# Inactive panes: subtle gray border
set -g pane-border-style 'fg=colour240'

# Dim inactive pane content slightly
# NOTE: disabled - these override the default foreground of everything drawn in
# the pane, which strips apps' own text colors (made pi's output unreadable).
# set -g window-style 'fg=colour250'
# set -g window-active-style 'fg=colour255'

# Thicker border for better visibility
set -g pane-border-lines 'heavy'
