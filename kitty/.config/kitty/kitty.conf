# Font configuration
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 11.0
background_opacity 0.85
# Theme is applied via base16-shell in the shell
# Catppuccin Mocha colors are set dynamically through base16-catppuccin-mocha

# Enable cursor customization (base16-shell sets cursor color)
shell_integration no-cursor

map ctrl+shift+f launch --allow-remote-control kitty +kitten kitty_search/search.py @active-kitty-window-id
map ctrl+shift+t launch --type=tab --cwd=~

# Basic settings
enable_audio_bell no
remember_window_size yes
initial_window_width  120c
initial_window_height 40c

# Scroll speed. On X11 the touchpad is a "low precision" device, so it uses
# wheel_scroll_multiplier (1.0 = 1 line per event). touch_scroll_multiplier
# only applies on macOS/Wayland, so it's left at default here.
wheel_scroll_multiplier 1.0
touch_scroll_multiplier 1.0
